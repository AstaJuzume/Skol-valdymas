.badge.green{background:#e9f5ed;color:#107c41}.badge.orange{background:#fff3df;color:#986009}.empty{text-align:center;padding:38px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.pad{padding:22px}.barrow{display:grid;grid-template-columns:110px 1fr 95px;align-items:center;gap:12px;margin:20px 0}.bar{height:9px;border-radius:9px;background:#f0eaf4;overflow:hidden}.bar span{display:block;height:100%;background:#9862ac;border-radius:9px}.banner{padding:14px 18px;border:1px solid #ded3e5;background:#f5eff8;border-radius:4px;color:#643777;line-height:1.6;margin-bottom:20px}.formrow{display:flex;flex-direction:column;gap:7px;margin:18px 0}.formrow label{font-size:12px;font-weight:600}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.muted{color:var(--muted)}.timeline{border-left:2px solid #e4d6eb;margin:10px 8px;padding-left:20px}.event{position:relative;padding:0 0 23px}.event:before{content:'';position:absolute;left:-26px;top:4px;background:#955ca5;border:3px solid white;width:8px;height:8px;border-radius:50%}.event p{margin:5px 0}.overlay{position:fixed;inset:0;background:#17101c65;z-index:30;display:flex;justify-content:flex-end}.drawer{width:660px;max-width:100%;height:100%;background:white;display:flex;flex-direction:column;box-shadow:-6px 0 28px #0002}.drawer.wide{width:830px}.drawerbody{padding:24px;overflow:auto;flex:1}.drawerfoot{padding:18px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.detailgrid small{display:block;color:var(--muted);margin-bottom:7px}.detailgrid strong{font-size:18px}.mail{background:#faf9fb;border:1px solid var(--line);border-radius:4px;padding:20px;line-height:1.8;white-space:pre-wrap}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:15px 25px;background:#2d2335;color:white;border-radius:6px;z-index:100;box-shadow:0 4px 20px #0003}.inline-info{font-size:12px;color:var(--muted);padding:15px 22px;border-top:1px solid var(--line)}.toggle{margin-left:auto}.mobile-menu{display:none}.split-label{display:flex;align-items:center;gap:9px}.statusdot{width:7px;height:7px;background:#107c41;border-radius:50%;display:inline-block;margin-right:6px}.steps{display:flex;gap:12px;margin:0 0 23px}.step{flex:1;background:#f2edf6;padding:12px;border-radius:4px;font-size:12px}.step b{color:var(--purple);margin-right:5px}.checkline{display:flex;gap:10px;align-items:flex-start;line-height:1.6;margin:20px 0}.error{color:#ae2525;background:#fff0f0;padding:12px;line-height:1.6}.upload{border:2px dashed #d3c4dc;border-radius:6px;padding:36px;text-align:center;background:#fcfaff}.upload p{color:var(--muted)}@media(max-width:1100px){main{padding:24px 20px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}@media(max-width:760px){aside{display:none}aside.open{display:flex;box-shadow:4px 0 20px #0003}main{margin:0;padding:20px 14px}.mobile-menu{display:block;background:transparent;color:white;border:0;padding:0}.brand{font-size:14px}.header-right .tag{display:none}header{padding:0 14px;gap:10px}.header-right select{max-width:145px;font-size:12px}.big{font-size:23px}.card{padding:15px}.formgrid,.detailgrid{grid-template-columns:1fr}.toolbar{padding:12px}.toolbar>*{max-width:100%}.panelhead{padding:16px}.heading h1{font-size:24px}.steps{flex-wrap:wrap}.step{min-width:100px}}
</style></head><body><header><button class="mobile-menu" onclick="document.querySelector('aside').classList.toggle('open')" aria-label="Atidaryti meniu">☰</button><span class="waffle">⠿</span><span class="brand">Power Apps <span style="opacity:.5;margin:0 12px">|</span> Skolų valdymas</span><div class="header-right"><span class="tag">DEMONSTRACIJA</span><select id="persona" aria-label="Demonstracinis vaidmuo" onchange="changePersona(this.value)"></select><span class="avatar" id="avatar">AK</span></div></header><aside><div class="appmark"><span class="logo">▤</span><div>Skolų valdymas<div class="note" style="margin-top:5px">Darbo aplinka</div></div></div><nav id="nav"></nav><div class="sidefoot"><span class="statusdot"></span> Demonstraciniai duomenys<br>Canvas aplikacijos prototipas<br><button class="link" style="margin-top:12px;font-size:12px" onclick="help()">Naudojimosi gidas ↗</button></div></aside><main id="main"></main><div id="modal"></div><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), euro=n=>new Intl.NumberFormat('lt-LT',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n), date=s=>s?new Date(s).toLocaleDateString('lt-LT'):'—', dt=s=>s?new Date(s).toLocaleString('lt-LT',{hour12:false}):'—', today='2026-11-03', days=s=>Math.max(0,Math.floor((Date.parse(today)-Date.parse(s))/86400000));
const key='skolu-demo-v1';let page='overview',persona='manager',q='',filter='all',mf='all',selected=new Set(),pending=null;
function seed(){let names=['Šiaurės projektai, UAB','Miesto sprendimai, UAB','Baltijos statyba, UAB','Žaliasis kiemas, UAB','Nauja kryptis, UAB','Vakarų prekyba, UAB','Aukštumos, UAB','Rytų logistika, UAB','Bendra erdvė, UAB','Santarvė, UAB','Krantų grupė, UAB','Mėlynoji linija, UAB'];let amounts=[12840,4275,8950,1680,6320,2150,15400,920,3700,5420,7650,0];return {users:[{id:'a',name:'Aistė Kazlauskaitė',role:'Vadybininkas',email:'aiste@example.com',active:true},{id:'m',name:'Mantas Jonaitis',role:'Vadybininkas',email:'mantas@example.com',active:true},{id:'r',name:'Rūta Petrauskė',role:'Vadybininkas',email:'ruta@example.com',active:true},{id:'v',name:'Darius Valaitis',role:'Vadovas',email:'darius@example.com',active:true},{id:'admin',name:'Administratorius',role:'Administratorius',email:'admin@example.com',active:true}],debtors:names.map((name,i)=>({id:'K'+String(i+1).padStart(3,'0'),name,email:'apskaita'+(i+1)+'@example.com',manager:['a','m','r'][i%3],debt:amounts[i],previous:amounts[i]+[2000,0,1200,0][i%4],due:['2026-09-10','2026-10-12','2026-10-25','2026-10-31'][i%4],payment:['2026-10-30','2026-10-21','2026-11-02'][i%3],paymentAmount:[2000,350,1200][i%3]})),reminders:[{id:'P001',debtor:'K001',at:'2026-10-28T09:20:00',email:'apskaita1@example.com',amount:14840,by:'a',stage:'Pirmasis priminimas',subject:'Priminimas apie neapmokėtą skolą',body:'Prašome apmokėti neapmokėtą skolą. Dėkojame.',status:'Išsiųsta (demo)'},{id:'P002',debtor:'K003',at:'2026-10-29T13:45:00',email:'apskaita3@example.com',amount:10150,by:'r',stage:'Pirmasis priminimas',subject:'Priminimas apie neapmokėtą skolą',body:'Prašome apmokėti neapmokėtą skolą. Dėkojame.',status:'Išsiųsta (demo)'}],imports:[{at:'2026-11-03T08:00:00',file:'butenta_2026-11-03.csv',count:12,changed:4,by:'admin'}],changes:[{debtor:'K001',at:'2026-11-03T08:00:00',old:14840,next:12840,payment:'2026-10-30',paymentAmount:2000},{debtor:'K003',at:'2026-11-03T08:00:00',old:10150,next:8950,payment:'2026-11-02',paymentAmount:1200}],settings:{time:'08:00',daily:true,subject:'Priminimas apie neapmokėtą skolą',body:'Sveiki,\n\nprimename, kad {klientas} neapmokėta skola šiuo metu yra {suma}. Prašome ją apmokėti artimiausiu metu.\n\nJei jau apmokėjote, dėkojame. Kilus klausimų, susisiekite su savo vadybininku.\n\nPagarbiai,\n{vadybininkas}',stages:[{name:'Pirmasis priminimas',days:1,active:true}]}}}
let db;try{db=JSON.parse(localStorage.getItem(key))||seed()}catch{db=seed()}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch{toast('Nepavyko išsaugoti naršyklėje. Patikrinkite saugyklos nustatymus.')}};
const user=()=>db.users.find(u=>u.id===(persona==='manager'?'a':persona==='manager2'?'m':persona==='leader'?'v':'admin'));
const isAdmin=()=>persona==='admin', isManager=()=>persona.startsWith('manager'), canSend=()=>isManager()&&user().active;
const uname=id=>db.users.find(u=>u.id===id)?.name||'Nepriskirta';
const managers=()=>db.users.filter(u=>u.role==='Vadybininkas');
const visible=()=>!user().active?[]:db.debtors.filter(d=>!isManager()||d.manager===user().id);
const hist=()=>db.reminders.filter(r=>visible().some(d=>d.id===r.debtor));
const latest=id=>db.reminders.filter(r=>r.debtor===id).sort((a,b)=>b.at.localeCompare(a.at))[0];
function status(d){return d.debt<=0?'<span class="badge green">Apmokėta</span>':latest(d.id)?'<span class="badge">Priminta</span>':'<span class="badge orange">Laukia priminimo</span>'}
function toast(t){$('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').innerHTML='',4200)}
function changePersona(p){persona=p;selected.clear();q='';mf='all';filter='all';if((page==='admin'||page==='import')&&!isAdmin())page='overview';closeModal();render()}
function go(p){page=p;q='';mf='all';filter='all';selected.clear();document.querySelector('aside').classList.remove('open');render()}
function render(){let u=user();$('persona').innerHTML=[['manager','Vadybininkė · Aistė'],['manager2','Vadybininkas · Mantas'],['leader','Vadovas'],['admin','Administratorius']].map(([v,t])=>`<option value="${v}" ${v===persona?'selected':''}>${t}</option>`).join('');$('avatar').textContent=u.name.split(' ').map(s=>s[0]).slice(0,2).join('');let nav=[['overview','◫','Apžvalga'],['debtors','▤',isManager()?'Mano skolininkai':'Visi skolininkai'],['reminders','✉','Priminimų istorija']];if(isAdmin())nav.push(['import','↥','Duomenų importas'],['admin','⚙','Administravimas']);$('nav').innerHTML=nav.map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="nav-icon">${ic}</span>${t}</button>`).join('');let titles={overview:['Apžvalga','Skolos, priminimai ir paskutiniai pokyčiai vienoje vietoje.'],debtors:[isManager()?'Mano skolininkai':'Visi skolininkai','Peržiūrėkite skolas ir paruoškite mokėjimo priminimus.'],reminders:['Priminimų istorija','Patvirtinti priminimai ir skolos pokyčiai po jų.'],import:['Duomenų importas','Kasdienis skolų informacijos atnaujinimas iš „Būtentos“ CSV.'],admin:['Administravimas','Naudotojai, priskyrimai ir priminimų nustatymai.']};let [title,desc]=titles[page];$('main').innerHTML=`<div class="crumb">Darbo aplinka / ${title}</div><div class="heading"><div><h1>${title}</h1><p class="sub">${desc}</p></div><div class="actions">${page==='overview'?`<span class="note">Duomenys: ${dt(db.imports.at(-1)?.at)}</span><button onclick="render();toast('Rodomi naujausi šiame prototipe išsaugoti duomenys')">↻ Atnaujinti</button>`:''}${page==='import'?'<button onclick="downloadSample()">↓ CSV pavyzdys</button>':''}</div></div>${!u.active?'<div class="banner">Šio naudotojo prieiga išjungta. Pakeiskite demonstracinį vaidmenį į administratorių ir aktyvuokite naudotoją.</div>':page==='overview'?overview():page==='debtors'?debtors():page==='reminders'?reminders():page==='import'?imports():admin()}`}
function stats(){let list=visible(),sum=list.reduce((s,d)=>s+d.debt,0),reduced=list.reduce((s,d)=>s+Math.max(0,d.previous-d.debt),0);return `<div class="cards"><div class="card"><small>Bendra skola</small><div class="big">${euro(sum)}</div><span class="note">${list.filter(d=>d.debt>0).length} aktyvių skolininkų</span></div><div class="card"><small>Vėluoja daugiau nei 30 d.</small><div class="big accent">${euro(list.filter(d=>days(d.due)>30).reduce((s,d)=>s+d.debt,0))}</div><span class="note">Pagal mokėjimo terminą</span></div><div class="card"><small>Patvirtinti priminimai</small><div class="big">${hist().length}</div><span class="note">Visa priminimų istorija</span></div><div class="card"><small>Skolos sumažėjimas</small><div class="big positive">−${euro(reduced)}</div><span class="note">Lyginant su ankstesniu importu</span></div></div>`}
function overview(){let list=visible().filter(d=>d.debt>0).sort((a,b)=>b.debt-a.debt);let total=Math.max(1,...managers().map(m=>list.filter(d=>d.manager===m.id).reduce((s,d)=>s+d.debt,0)));return stats()+`<div class="grid2"><section class="panel"><div class="panelhead"><h2>Didžiausios skolos</h2><button class="link" onclick="go('debtors')">Visi skolininkai →</button></div>${debtorTable(list.slice(0,5),false)}</section><section class="panel"><div class="panelhead"><h2>${isManager()?'Mano skolų pasiskirstymas':'Skolos pagal vadybininką'}</h2></div><div class="pad">${isManager()?['1–7 d.','8–30 d.','31+ d.'].map((n,i)=>{let v=list.filter(d=>i===0?days(d.due)<=7:i===1?days(d.due)>7&&days(d.due)<=30:days(d.due)>30).reduce((s,d)=>s+d.debt,0);return `<div class="barrow"><span>${n}</span><div class="bar"><span style="width:${v/Math.max(1,list.reduce((s,d)=>s+d.debt,0))*100}%"></span></div><strong class="money">${euro(v)}</strong></div>`}).join(''):managers().map(m=>{let v=list.filter(d=>d.manager===m.id).reduce((s,d)=>s+d.debt,0);return `<div class="barrow"><span>${esc(m.name.split(' ')[0])}</span><div class="bar"><span style="width:${v/total*100}%"></span></div><strong class="money">${euro(v)}</strong></div>`}).join('')}<p class="note">Atskaitos data: ${today}. Duomenys demonstraciniai.</p></div></section></div><section class="panel"><div class="panelhead"><h2>Naujausi veiksmai</h2><span class="note">Priminimai ir duomenų pokyčiai</span></div><div class="pad timeline">${activity()}</div></section>`}
function activity(){let events=[...hist().map(r=>({at:r.at,title:'Patvirtintas priminimas',text:`${db.debtors.find(d=>d.id===r.debtor)?.name} · ${euro(r.amount)} · ${uname(r.by)}`})),...db.changes.filter(c=>visible().some(d=>d.id===c.debtor)).map(c=>({at:c.at,title:'Atnaujinta skolos informacija',text:`${db.debtors.find(d=>d.id===c.debtor)?.name} · ${euro(c.old)} → ${euro(c.next)}`}))].sort((a,b)=>b.at.localeCompare(a.at));return events.slice(0,6).map(e=>`<div class="event"><small class="muted">${dt(e.at)}</small><p><strong>${esc(e.title)}</strong></p><span class="note">${esc(e.text)}</span></div>`).join('')||'<span class="muted">Veiksmų dar nėra.</span>'}
function filtered(){return visible().filter(d=>(d.name+' '+d.id+' '+d.email).toLowerCase().includes(q.toLowerCase())&&(mf==='all'||d.manager===mf)&&(filter==='all'||filter==='over30'&&days(d.due)>30&&d.debt>0||filter==='pending'&&!latest(d.id)&&d.debt>0||filter==='reminded'&&latest(d.id)||filter==='paid'&&d.debt===0))}
function debtors(){return `<section class="panel"><div class="panelhead"><div><h2>Skolininkų registras <span class="badge">${visible().length}</span></h2></div><div class="actions">${canSend()?`<span class="note" id="selectedCount">Pasirinkta: ${selected.size}</span><button class="primary" id="prepare" ${selected.size?'':'disabled'} onclick="prepareReminders()">✉ Paruošti priminimą</button>`:'<span class="note">Peržiūros režimas</span>'}</div></div><div class="toolbar"><input aria-label="Ieškoti skolininko" placeholder="⌕  Ieškoti pagal pavadinimą, kodą, el. paštą" value="${esc(q)}" oninput="q=this.value;updateTable()"><select aria-label="Skolos būsena" onchange="filter=this.value;updateTable()">${[['all','Visos būsenos'],['pending','Laukia priminimo'],['reminded','Priminta'],['over30','Vėluoja > 30 d.'],['paid','Apmokėta']].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select>${!isManager()?`<select aria-label="Vadybininkas" onchange="mf=this.value;updateTable()"><option value="all">Visi vadybininkai</option>${managers().map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>`:''}</div><div id="registry">${debtorTable(filtered(),true)}</div><div class="inline-info">Pasirinkite skolininko pavadinimą, kad atidarytumėte kortelę. Rodoma tik šiam vaidmeniui prieinama informacija.</div></section>`}
function debtorTable(list,full){return `<div class="tablewrap"><table><thead><tr>${full&&canSend()?'<th><input type="checkbox" aria-label="Pasirinkti visus matomus skolininkus" onchange="selectAll(this.checked)"></th>':''}<th>Skolininkas</th>${full&&!isManager()?'<th>Vadybininkas</th>':''}<th class="money">Skola</th><th>Vėlavimas</th>${full?'<th>Paskutinis mokėjimas</th><th>Pokytis</th>':''}<th>Būsena</th><th></th></tr></thead><tbody>${list.map(d=>`<tr>${full&&canSend()?`<td><input aria-label="Pasirinkti ${esc(d.name)}" type="checkbox" ${selected.has(d.id)?'checked':''} ${d.debt<=0?'disabled':''} onchange="pick('${d.id}',this.checked)"></td>`:''}<td class="company"><button class="link" onclick="detail('${d.id}')">${esc(d.name)}</button><small>${d.id} · ${esc(d.email)}</small></td>${full&&!isManager()?`<td>${esc(uname(d.manager))}</td>`:''}<td class="money"><strong>${euro(d.debt)}</strong></td><td>${d.debt>0?`<span class="badge ${days(d.due)>30?'red':'orange'}">${days(d.due)} d.</span>`:'—'}</td>${full?`<td>${date(d.payment)}<div class="note">${euro(d.paymentAmount)}</div></td><td class="${d.debt<d.previous?'positive':'muted'}">${d.debt===d.previous?'—':(d.debt>d.previous?'+':'')+euro(d.debt-d.previous)}</td>`:''}<td>${status(d)}</td><td><button class="link" aria-label="Atidaryti ${esc(d.name)}" onclick="detail('${d.id}')">→</button></td></tr>`).join('')||`<tr><td colspan="10" class="empty">Pagal pasirinktus kriterijus skolininkų nerasta.</td></tr>`}</tbody></table></div>`}
function updateTable(){$('registry').innerHTML=debtorTable(filtered(),true)}
function pick(id,v){v?selected.add(id):selected.delete(id);$('selectedCount').textContent='Pasirinkta: '+selected.size;$('prepare').disabled=!selected.size}
function selectAll(v){filtered().filter(d=>d.debt>0).forEach(d=>v?selected.add(d.id):selected.delete(d.id));updateTable();$('selectedCount').textContent='Pasirinkta: '+selected.size;$('prepare').disabled=!selected.size}
function drawer(title,subtitle,body,foot='',wide=false){$('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="panelhead"><div><h2>${esc(title)}</h2><p class="sub note" style="margin-top:6px">${esc(subtitle)}</p></div><button aria-label="Uždaryti" onclick="closeModal()">✕</button></div><div class="drawerbody">${body}</div><div class="drawerfoot">${foot||'<button onclick="closeModal()">Uždaryti</button>'}</div></section></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.drawer button')?.focus(),0)}
function closeModal(){$('modal').innerHTML='';document.body.style.overflow='';pending=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('modal').children.length){let a=[...$('modal').querySelectorAll('button,input,select,textarea,a')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
function detail(id){let d=visible().find(d=>d.id===id);if(!d)return;let h=hist().filter(r=>r.debtor===id),changes=db.changes.filter(c=>c.debtor===id);drawer(d.name,`${d.id} · ${uname(d.manager)}`,`<div class="detailgrid"><div><small>Neapmokėta skola</small><strong class="accent">${euro(d.debt)}</strong></div><div><small>Ankstesnio importo skola</small><strong>${euro(d.previous)}</strong></div><div><small>Paskutinis mokėjimas</small><strong>${euro(d.paymentAmount)}</strong><p class="note">${date(d.payment)}</p></div><div><small>Mokėjimo terminas / vėlavimas</small><strong>${date(d.due)}</strong><p class="note">${d.debt>0?days(d.due):0} d.</p></div></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="formgrid"><div class="formrow"><label>Gavėjo el. paštas</label><span>${esc(d.email)}</span></div><div class="formrow"><label>Būsena</label><div>${status(d)}</div></div></div><h3>Skolos ir mokėjimų pokyčiai</h3>${changes.length?changes.slice().reverse().map(c=>`<div class="banner"><strong>${date(c.at)}</strong> · ${euro(c.old)} → ${euro(c.next)}<div class="note">Paskutinis mokėjimas: ${date(c.payment)}, ${euro(c.paymentAmount)}</div></div>`).join(''):'<p class="muted">Po importo užfiksuotų pokyčių nėra.</p>'}<h3 style="margin-top:25px">Priminimų istorija</h3>${h.length?h.slice().reverse().map(r=>`<div class="panel pad"><strong>${esc(r.stage)}</strong><p class="note">${dt(r.at)} · ${esc(r.email)}</p><p>${euro(r.amount)} <span class="badge green">${esc(r.status)}</span></p><p class="note">Patvirtino: ${esc(uname(r.by))}</p><div class="note">Dabartinės skolos pokytis nuo priminimo: <strong class="${d.debt<r.amount?'positive':''}">${euro(d.debt-r.amount)}</strong></div><button class="link" style="margin-top:12px" onclick="showReminder('${r.id}')">Peržiūrėti laišką →</button></div>`).join(''):'<p class="muted">Priminimų dar nėra.</p>'}`,`${canSend()&&d.debt>0?`<button class="primary" onclick="selected=new Set(['${d.id}']);prepareReminders()">Paruošti priminimą</button>`:''}<button onclick="closeModal()">Uždaryti</button>`)}
function fill(t,d){return t.replaceAll('{klientas}',d.name).replaceAll('{suma}',euro(d.debt)).replaceAll('{vadybininkas}',uname(d.manager))}
function prepareReminders(){if(!canSend())return;let list=visible().filter(d=>selected.has(d.id)&&d.debt>0);if(!list.length)return;let stages=db.settings.stages.filter(s=>s.active);if(!stages.length){toast('Nėra aktyvaus priminimo etapo. Kreipkitės į administratorių.');return}let body=`<div class="steps"><div class="step"><b>1</b> Atrinkti skolininkai</div><div class="step"><b>2</b> Peržiūra</div><div class="step"><b>3</b> Patvirtinimas</div></div><div class="banner">Bus paruošti ${list.length} individualūs priminimai. Siuntimas vykdomas tik patvirtinus. Prototipe laiškai nesiunčiami tikriems gavėjams.</div><div class="formrow"><label>Priminimo etapas</label><select id="sendStage">${stages.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="formrow"><label>Tema</label><input id="mailSubject" value="${esc(db.settings.subject)}"></div><div class="formrow"><label>Laiško tekstas (pritaikomas kiekvienam gavėjui)</label><textarea id="mailBody" rows="8" oninput="previewMails()">${esc(db.settings.body)}</textarea><small class="muted">Kintamieji: {klientas}, {suma}, {vadybininkas}</small></div><h3>Individualių laiškų peržiūra</h3><div id="mailPreviews"></div><label class="checkline"><input type="checkbox" id="approve" onchange="document.getElementById('sendBtn').disabled=!this.checked"><span>Peržiūrėjau gavėjus, skolos sumas ir laiškų turinį. Patvirtinu pasirinktų priminimų siuntimą.</span></label><div id="mailError"></div>`;drawer('Priminimų peržiūra ir patvirtinimas',`${list.length} gavėjai · ${euro(list.reduce((s,d)=>s+d.debt,0))}`,body,'<button onclick="closeModal()">Atšaukti</button><button class="primary" id="sendBtn" disabled onclick="sendReminders()">Patvirtinti ir siųsti (demo)</button>',true);pending=list.map(d=>d.id);previewMails()}
function previewMails(){if(!pending)return;$('mailPreviews').innerHTML=pending.map(id=>{let d=db.debtors.find(d=>d.id===id);return `<div class="panel pad"><strong>${esc(d.name)}</strong><p class="note">Kam: ${esc(d.email)} · Skola: ${euro(d.debt)}</p><div class="mail">${esc(fill($('mailBody').value,d))}</div></div>`}).join('')}
function sendReminders(){if(!canSend()||!$('approve')?.checked||!pending)return;if(!$('mailSubject').value.trim()||!$('mailBody').value.trim()){$('mailError').innerHTML='<div class="error">Įrašykite laiško temą ir tekstą.</div>';return}let list=pending.map(id=>visible().find(d=>d.id===id)).filter(Boolean);if(list.some(d=>!/^\S+@\S+\.\S+$/.test(d.email))){$('mailError').innerHTML='<div class="error">Patikrinkite gavėjų el. pašto adresus.</div>';return}let at=new Date().toISOString();list.forEach(d=>db.reminders.push({id:'P'+Date.now()+d.id,debtor:d.id,at,email:d.email,amount:d.debt,by:user().id,stage:$('sendStage').value,subject:fill($('mailSubject').value,d),body:fill($('mailBody').value,d),status:'Išsiųsta (demo)'}));save();closeModal();selected.clear();render();toast(`Patvirtinta ${list.length} priminimų. Demonstracinis siuntimas užfiksuotas istorijoje.`)}
function reminders(){let list=hist().slice().reverse().filter(r=>{let d=db.debtors.find(d=>d.id===r.debtor);return (d.name+' '+r.email+' '+r.stage).toLowerCase().includes(q.toLowerCase())});return `<section class="panel"><div class="panelhead"><h2>Priminimų registras <span class="badge">${hist().length}</span></h2><span class="note">Siuntimas imituojamas</span></div><div class="toolbar"><input value="${esc(q)}" aria-label="Ieškoti priminimo" placeholder="⌕  Ieškoti kliento, gavėjo ar etapo" oninput="q=this.value;refreshHistory()"></div><div id="historyTable">${historyTable(list)}</div></section>`}
function historyTable(list){return `<div class="tablewrap"><table><thead><tr><th>Data ir laikas</th><th>Skolininkas / gavėjas</th><th>Etapas</th><th class="money">Skola siuntimo metu</th><th class="money">Pokytis po priminimo</th><th>Patvirtino</th><th></th></tr></thead><tbody>${list.map(r=>{let d=db.debtors.find(d=>d.id===r.debtor);return `<tr><td>${dt(r.at)}</td><td class="company"><button class="link" onclick="detail('${d.id}')">${esc(d.name)}</button><small>${esc(r.email)}</small></td><td><span class="badge">${esc(r.stage)}</span></td><td class="money">${euro(r.amount)}</td><td class="money ${d.debt<r.amount?'positive':''}">${euro(d.debt-r.amount)}</td><td>${esc(uname(r.by))}</td><td><button class="link" onclick="showReminder('${r.id}')">Laiškas →</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Priminimų nerasta.</td></tr>'}</tbody></table></div>`}
function refreshHistory(){let v=hist().slice().reverse().filter(r=>{let d=db.debtors.find(d=>d.id===r.debtor);return (d.name+' '+r.email+' '+r.stage).toLowerCase().includes(q.toLowerCase())});$('historyTable').innerHTML=historyTable(v)}
function showReminder(id){let r=hist().find(r=>r.id===id);if(!r)return;drawer(r.subject,'Patvirtintas priminimas',`<div class="banner">${esc(r.status)} · ${dt(r.at)}<br>Patvirtino: ${esc(uname(r.by))}</div><p><strong>Kam:</strong> ${esc(r.email)}</p><p><strong>Skola siuntimo metu:</strong> ${euro(r.amount)}</p><div class="mail">${esc(r.body)}</div><p class="note">Tai demonstracinis įrašas. Tikras el. laiškas nebuvo išsiųstas.</p>`)}
function imports(){return `<div class="banner">Kasdienis procesas: CSV gavimas → patikra → skolos atnaujinimas → pokyčių fiksavimas. Prototipe failą įkelkite rankiniu būdu arba paleiskite kitos dienos demonstraciją.</div><div class="grid2"><section class="panel"><div class="panelhead"><h2>Įkelti CSV failą</h2><span class="badge">Būtenta</span></div><div class="pad"><div class="upload"><div style="font-size:35px;color:var(--purple)">↥</div><h3 style="margin-top:15px">Atnaujinkite skolų informaciją</h3><p>UTF-8 CSV · kabliataškis arba kablelis</p><input type="file" id="csv" accept=".csv,text/csv" aria-label="Pasirinkite CSV failą" onchange="loadCSV(this.files[0])"></div><div id="importPreview"></div><p class="note">Demonstracinė struktūra: kliento_kodas, pavadinimas, el_pastas, vadybininko_id, skola, terminas, paskutinis_mokejimas, mokejimo_suma. Galutiniai „Būtentos“ laukai derinami projekto metu.</p></div></section><section class="panel"><div class="panelhead"><h2>Kasdienio proceso demonstracija</h2></div><div class="pad"><h3>Kitas duomenų atnaujinimas</h3><p class="muted">Imituokite naują eksportą: pirmojo skolininko skola sumažės 500 €, pasikeis paskutinio mokėjimo data ir bus išsaugotas pokytis. Ankstesni priminimai išliks.</p><button class="primary" onclick="simulateImport()">↻ Imituoti kasdienį importą</button><div style="margin-top:25px;border-top:1px solid var(--line);padding-top:18px"><p><span class="statusdot"></span>Numatytas laikas: <strong>${esc(db.settings.time)}</strong></p><p class="note">${db.settings.daily?'Kasdienis procesas įjungtas nustatymuose.':'Kasdienis procesas išjungtas nustatymuose.'} Automatinis vykdymas šiame statiniame prototipe neatliekamas.</p></div></div></section></div><section class="panel"><div class="panelhead"><h2>Importų istorija</h2></div><div class="tablewrap"><table><thead><tr><th>Data ir laikas</th><th>Failas</th><th>Įrašai</th><th>Pokyčiai</th><th>Vykdytojas</th><th>Būsena</th></tr></thead><tbody>${db.imports.slice().reverse().map(i=>`<tr><td>${dt(i.at)}</td><td>${esc(i.file)}</td><td>${i.count}</td><td>${i.changed}</td><td>${esc(uname(i.by))}</td><td><span class="badge green">Atnaujinta</span></td></tr>`).join('')}</tbody></table></div></section>`}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let first=text.split(/\r?\n/)[0],sep=first.includes(';')?';':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('Neuždarytos kabutės CSV faile.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
const columns=['kliento_kodas','pavadinimas','el_pastas','vadybininko_id','skola','terminas','paskutinis_mokejimas','mokejimo_suma'];let importData=null,importFile='';
async function loadCSV(file){importData=null;if(!isAdmin()||!file)return;if(file.size>2e6){$('importPreview').innerHTML='<p class="error">Failas per didelis. Prototipo riba – 2 MB.</p>';return}try{let rows=parseCSV(await file.text()),head=rows.shift()?.map(x=>x.trim());if(!head||columns.some(x=>!head.includes(x)))throw Error('Trūksta privalomų laukų. Atsisiųskite CSV pavyzdį.');let seen=new Set();let data=rows.map((row,i)=>{let v=Object.fromEntries(head.map((h,j)=>[h,(row[j]??'').trim()])),num=s=>Number(s.replace(/\s/g,'').replace(',','.')),validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;if(row.length!==head.length)throw Error(`Eilutė ${i+2}: neteisingas laukų skaičius.`);if(!/^[A-Za-z0-9_-]+$/.test(v.kliento_kodas)||!v.pavadinimas||seen.has(v.kliento_kodas))throw Error(`Eilutė ${i+2}: kodas turi būti sudarytas iš raidžių, skaičių, _ arba -, pavadinimas privalomas, kodai negali kartotis.`);seen.add(v.kliento_kodas);if(!/^\S+@\S+\.\S+$/.test(v.el_pastas))throw Error(`Eilutė ${i+2}: netinkamas el. paštas.`);if(!managers().some(m=>m.id===v.vadybininko_id))throw Error(`Eilutė ${i+2}: nežinomas vadybininko ID.`);if(!v.skola||!v.mokejimo_suma||![num(v.skola),num(v.mokejimo_suma)].every(n=>Number.isFinite(n)&&n>=0))throw Error(`Eilutė ${i+2}: skola ir mokėjimas turi būti neneigiami skaičiai.`);if(!validDate(v.terminas)||(v.paskutinis_mokejimas&&!validDate(v.paskutinis_mokejimas)))throw Error(`Eilutė ${i+2}: data turi būti YYYY-MM-DD.`);return {id:v.kliento_kodas,name:v.pavadinimas,email:v.el_pastas,manager:v.vadybininko_id,debt:num(v.skola),due:v.terminas,payment:v.paskutinis_mokejimas,paymentAmount:num(v.mokejimo_suma)}});if(!data.length)throw Error('Faile nėra duomenų eilučių.');importData=data;importFile=file.name;$('importPreview').innerHTML=`<div class="banner" style="margin-top:18px"><strong>Patikra sėkminga: ${data.length} įrašai</strong><br>Nauji: ${data.filter(d=>!db.debtors.some(x=>x.id===d.id)).length}. Esami atnaujinami pagal kliento kodą. Priminimų istorija išsaugoma. Faile nesantys klientai nekeičiami.</div><button class="primary" onclick="commitImport()">Patvirtinti importą</button>`}catch(e){$('importPreview').innerHTML=`<p class="error">${esc(e.message)} Duomenys nepakeisti.</p>`}}
function applyImport(data,file){let at=new Date().toISOString(),changed=0;db.debtors.forEach(d=>d.previous=d.debt);for(let incoming of data){let d=db.debtors.find(d=>d.id===incoming.id);if(d){if(d.debt!==incoming.debt||d.payment!==incoming.payment||d.paymentAmount!==incoming.paymentAmount){db.changes.push({debtor:d.id,at,old:d.debt,next:incoming.debt,payment:incoming.payment,paymentAmount:incoming.paymentAmount});changed++}Object.assign(d,incoming)}else{db.debtors.push({...incoming,previous:incoming.debt});changed++}}db.imports.push({at,file,count:data.length,changed,by:user().id});save();render();toast(`Importuota ${data.length} įrašų. Užfiksuota pokyčių: ${changed}.`)}
function commitImport(){if(!isAdmin()||!importData)return;let data=importData;importData=null;applyImport(data,importFile)}
function simulateImport(){if(!isAdmin())return;let d=db.debtors.find(d=>d.debt>=500);if(!d){toast('Nėra skolininko, kurio skola būtų bent 500 €.');return}applyImport([{id:d.id,name:d.name,email:d.email,manager:d.manager,debt:d.debt-500,due:d.due,payment:today,paymentAmount:500}],'butenta_demo_kita_diena.csv')}
function downloadFile(name,text,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadSample(){downloadFile('butenta_pavyzdys.csv','\uFEFF'+columns.join(';')+'\n'+db.debtors.map(d=>[d.id,d.name,d.email,d.manager,d.debt,d.due,d.payment,d.paymentAmount].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8')}
function admin(){return `<div class="banner">Vaidmenų perjungiklis viršuje skirtas demonstracijai. Tikrame sprendime prieigos būtų susietos su Microsoft 365 paskyromis.</div><section class="panel"><div class="panelhead"><h2>Naudotojai ir prieigos</h2><button onclick="editUser()">＋ Pridėti naudotoją</button></div><div class="tablewrap"><table><thead><tr><th>Naudotojas</th><th>El. paštas</th><th>Vaidmuo</th><th>Prieiga</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td><span class="badge ${u.active?'green':'red'}">${u.active?'Aktyvi':'Išjungta'}</span></td><td><button class="link" onclick="editUser('${u.id}')">Redaguoti</button></td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="panelhead"><h2>Skolininkų priskyrimas vadybininkams</h2><span class="note">Pakeitimai išsaugomi iš karto</span></div><div class="tablewrap"><table><thead><tr><th>Skolininkas</th><th>Kodas</th><th>Vadybininkas</th></tr></thead><tbody>${db.debtors.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.id)}</td><td><select aria-label="${esc(d.name)} vadybininkas" onchange="assign('${d.id}',this.value)">${managers().map(m=>`<option value="${esc(m.id)}" ${d.manager===m.id?'selected':''}>${esc(m.name)}${!m.active?' (neaktyvus)':''}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></section><div class="grid2"><section class="panel"><div class="panelhead"><h2>Priminimo laiško šablonas</h2></div><form class="pad" onsubmit="event.preventDefault();saveSettings()"><div class="formrow"><label for="subject">Laiško tema</label><input required id="subject" value="${esc(db.settings.subject)}"></div><div class="formrow"><label for="template">Laiško tekstas</label><textarea required id="template" rows="9">${esc(db.settings.body)}</textarea><small class="muted">{klientas} · {suma} · {vadybininkas}</small></div><div class="formrow"><label for="runTime">Kasdienio CSV importo laikas</label><input type="time" required id="runTime" value="${esc(db.settings.time)}"></div><label class="checkline"><input type="checkbox" id="daily" ${db.settings.daily?'checked':''}>Kasdienis importas įjungtas (demonstracinis nustatymas)</label><button class="primary">Išsaugoti nustatymus</button></form></section><section class="panel"><div class="panelhead"><h2>Priminimų etapai</h2><button onclick="editStage()">＋ Pridėti</button></div><div class="pad"><p class="note">Konfigūravimo pagrindas. Konkretūs etapai ir taisyklės derinami projekto metu. Dienų slenkstis informacinis; automatinių laiškų siuntimo nėra.</p>${db.settings.stages.map((s,i)=>`<div class="panel pad"><strong>${esc(s.name)}</strong><p class="note">Nuo ${s.days} vėlavimo dienos · ${s.active?'Aktyvus':'Neaktyvus'}</p><button class="link" onclick="editStage(${i})">Redaguoti</button></div>`).join('')}<p class="note">Bet kuriame etape būtinas vadybininko patvirtinimas.</p></div></section></div><section class="panel pad"><h3>Demonstracijos duomenys</h3><p class="muted">Atkurkite pradinius pavyzdžius prieš pristatydami kitam klientui. Bus pašalinti šiame prototipe atlikti pakeitimai.</p><button onclick="resetDemo()">Atkurti demonstracinius duomenis</button></section>`}
function assign(id,m){if(!isAdmin())return;db.debtors.find(d=>d.id===id).manager=m;save();toast('Vadybininko priskyrimas išsaugotas')}
function editUser(id){if(!isAdmin())return;let u=db.users.find(u=>u.id===id)||{id:'',name:'',email:'',role:'Vadybininkas',active:true},fixed=['a','m','r','v','admin'].includes(id);drawer(id?'Redaguoti naudotoją':'Naujas naudotojas','Prieigos valdymas',`<form id="userForm" onsubmit="event.preventDefault();saveUser('${esc(u.id)}')"><div class="formrow"><label>Vardas, pavardė</label><input required id="uName" value="${esc(u.name)}"></div><div class="formrow"><label>El. paštas</label><input type="email" required id="uEmail" value="${esc(u.email)}"></div><div class="formrow"><label>Vaidmuo</label><select id="uRole" ${fixed?'disabled':''}>${['Vadybininkas','Vadovas','Administratorius'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select>${fixed?'<small class="muted">Pagrindinių demonstracinių paskyrų vaidmuo fiksuotas.</small>':''}</div><label class="checkline"><input type="checkbox" id="uActive" ${u.active?'checked':''} ${id==='admin'?'disabled':''}>Aktyvi prieiga</label><div id="uError"></div></form>`,'<button onclick="closeModal()">Atšaukti</button><button class="primary" type="submit" form="userForm">Išsaugoti</button>')}
function saveUser(id){if(!isAdmin())return;let old=db.users.find(u=>u.id===id);let role=$('uRole').value;if(old?.role==='Vadybininkas'&&role!=='Vadybininkas'&&db.debtors.some(d=>d.manager===id)){$('uError').innerHTML='<p class="error">Pirmiausia priskirkite šio naudotojo skolininkus kitam vadybininkui.</p>';return}let email=$('uEmail').value.trim();if(db.users.some(u=>u.id!==id&&u.email.toLowerCase()===email.toLowerCase())){$('uError').innerHTML='<p class="error">Šis el. paštas jau naudojamas.</p>';return}let val={id:id||'u'+Date.now(),name:$('uName').value.trim(),email,role,active:$('uActive').checked};if(!val.name)return;if(old)Object.assign(old,val);else db.users.push(val);save();closeModal();render();toast('Naudotojo duomenys išsaugoti')}
function saveSettings(){if(!isAdmin())return;Object.assign(db.settings,{subject:$('subject').value.trim(),body:$('template').value.trim(),time:$('runTime').value,daily:$('daily').checked});save();toast('Nustatymai išsaugoti')}
function editStage(i){if(!isAdmin())return;let s=db.settings.stages[i]||{name:'',days:7,active:true};drawer('Priminimo etapas','Demonstracinės taisyklės',`<form id="stageForm" onsubmit="event.preventDefault();saveStage(${i===undefined?-1:i})"><div class="formrow"><label>Etapo pavadinimas</label><input required id="sName" value="${esc(s.name)}"></div><div class="formrow"><label>Vėlavimo dienų slenkstis</label><input required id="sDays" type="number" min="0" max="3650" value="${s.days}"></div><label class="checkline"><input type="checkbox" id="sActive" ${s.active?'checked':''}>Etapas aktyvus</label><div class="banner">Visiems priminimams privalomas darbuotojo patvirtinimas.</div></form>`,'<button onclick="closeModal()">Atšaukti</button><button class="primary" type="submit" form="stageForm">Išsaugoti</button>')}
function saveStage(i){if(!isAdmin())return;let s={name:$('sName').value.trim(),days:Number($('sDays').value),active:$('sActive').checked};if(!s.name)return;i<0?db.settings.stages.push(s):db.settings.stages[i]=s;save();closeModal();render();toast('Etapas išsaugotas')}
function resetDemo(){drawer('Atkurti pradinius duomenis?','Demonstracijos atstatymas','<p>Bus pašalinti jūsų importai, priminimai ir nustatymų pakeitimai. Pradiniai pavyzdžiai bus atkurti.</p>','<button onclick="closeModal()">Atšaukti</button><button class="primary" onclick="db=seed();save();closeModal();render();toast(\'Pradiniai duomenys atkurti\')">Atkurti</button>')}
function help(){drawer('Trumpas naudojimosi gidas','Power Apps stiliaus demonstracija',`<h3>1. Vadybininko darbo eiga</h3><p>Atidarykite „Mano skolininkai“, raskite klientą, peržiūrėkite kortelę. Pažymėkite vieną arba kelis klientus, paruoškite priminimus, peržiūrėkite individualius laiškus ir patvirtinkite.</p><h3>2. Vadovo peržiūra</h3><p>Viršuje pasirinkite „Vadovas“. Matysite visų vadybininkų skolas, priminimus ir skolos pokytį nuo priminimo.</p><h3>3. Administratoriaus darbo eiga</h3><p>Pasirinkite „Administratorius“. Įkelkite CSV arba imituokite kasdienį importą. Valdykite naudotojus, priskyrimus, laiškų šabloną ir priminimų etapus.</p><h3>Demonstracijos ribos</h3><p>Duomenys išsaugomi tik šioje naršyklėje. Vaidmenys imituojami. Tikri laiškai nesiunčiami, automatinis importas nevykdomas. Galutinė CSV struktūra ir priminimų taisyklės turi būti suderintos projekto metu.</p><p class="note">Vėlavimui skaičiuoti naudojama demonstracinė ${today} data. Naujų veiksmų laikas – dabartinis.</p>`)}
render();
</script></body></html>
